services:
  db:
    image: postgres:18
    container_name: gudangku-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gudangku
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - gudangku-postgres-data:/var/lib/postgresql

volumes:
  gudangku-postgres-data: